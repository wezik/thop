name: SonarCloud

on:
  pull_request:
    branches: 
      - develop
  push:
    branches: 
      - develop

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: ☁️ Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔧 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: 👌 Run tests with coverage
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          go test ./test/... -coverpkg=./... -coverprofile=coverage.out -covermode=atomic -v

      - name: 🕵  SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
