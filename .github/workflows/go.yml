name: Build and Test (Go)

on:
  push:
    branches: 
      - develop
    tags:
      - '*'
  pull_request:
    branches: 
      - develop

permissions:
  checks: write # used by the EnricoMi/publish-unit-test-result-action
  contents: write # used by the EnricoMi/publish-unit-test-result-action
  pull-requests: write # used by the EnricoMi/publish-unit-test-result-action

jobs:
  build:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - name: ☁️ Checkout source code
        uses: actions/checkout@v5

      - name: 🔧 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: 📦 Build
        run: go build -v .

      - name: 👌 Run tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          go test -v ./test/... 2>&1 | tee test_output.txt
      
      - name: 📂 Parse test results
        run: cat test_output.txt | go run github.com/jstemmer/go-junit-report/v2@latest -set-exit-code > report.xml

      - name: 💬 Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (success() || failure()) && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') && (github.event_name == 'pull_request')
        with:
          files: report.xml
