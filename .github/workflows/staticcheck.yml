name: Static analysis

on:
  pull_request:
    branches: 
      - develop

  push:
    branches: 
      - develop

permissions:
  contents: read # used by checkout

jobs:
  static-analysis:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: ☁️ Checkout source code
        uses: actions/checkout@v5

      - name: 🔧 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: 🔍 Verify modules
        run: go mod verify

      - name: 🧠 Run go vet
        run: go vet ./...

      - name: 🧹 Run staticcheck
        uses: dominikh/staticcheck-action@v1

      - name: 🧼 Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: 📦 Check mod tidy
        run: |
          go mod tidy -v
          git diff --exit-code
